<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="POST">
        <select name="course_code" id="" required>
            <option value=""> --select a course--</option>
            {% for c in courses %}
            <option value="{{ c.code }}" {% if chosen == c.code|string %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
        <input type="submit" value="load">
    </form>
        {% if chosen %}
            <form method="post" action="/gradeitem">
                <select name="item" id="" required>
                    <option value=""> --select item--</option>
                    {% for a in items_assignments%}
                        <option value="assignment:{{a.assignment_id}}">{{a.name}}</option>
                    {% endfor %}
                    {% for e in items_exams %} 
                        <option value="exam:{{e.exam_id}}"> {{e.name}}</option>
                    {% endfor %}
            </select>
            {% if roster %}
        
                <table>
                    <tr> <td>ID</td> <td>Name</td> <td>grade</td></tr>
                        {% for r in roster %}
                        <tr> <td>{{ r.id }}</td> <td>{{ r.fname }} {{ r.lname }} </td>
                        <td> <input type="number" name="grade_{{ r.id }}" min="0" max="100"></td>
                    </tr>
                    {% endfor %}
                </table>
                <input type="submit" value="save grades">
                {% endif %}
        </form> 
        {% endif %}
</body>
</html>
