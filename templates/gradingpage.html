{% extends "base.html" %}
{% block content %}
<div class="grading">
    {% if sem %}<p>Grading for: {{ sem.name }}</p>{% endif %}
    <h1>Grade a course</h1>

    <div class="grading-layout">
        <div class="grading-sidebar">
            <div class="form-card">
                <form method="POST">
                    <label for="course_code">Course</label>
                    <select name="course_code" id="course_code" required>
                        <option value=""> -- select -- </option>
                        {% for c in courses %}
                        <option value="{{ c.code }}" {% if chosen == c.code|string %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit">load</button>
                </form>
            </div>

            {% if chosen %}
            <div class="form-card">
                <label for="item">Item</label>
                <select name="item" id="item" form="gradeform" required>
                    <option value=""> -- select -- </option>
                    {% for a in items_assignments %}
                        <option value="assignment:{{ a.assignment_id }}">
                            {{ a.name }}{% if a.assignment_id in graded_assignment_ids %} (graded){% endif %}
                        </option>
                    {% endfor %}
                    {% for e in items_exams %}
                        <option value="exam:{{ e.exam_id }}">
                            {{ e.name }}{% if e.exam_id in graded_exam_ids %} (graded){% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
        </div>

        <div class="grading-main">
            {% if chosen and roster %}
            <form method="post" action="/gradeitem" id="gradeform">
                <table>
                    <thead>
                        <tr><th>ID</th> <th>Name</th> <th>Grade</th></tr>
                    </thead>
                    <tbody>
                    {% for r in roster %}
                        <tr>
                            <td>{{ r.id }}</td>
                            <td>{{ r.fname }} {{ r.lname }}</td>
                            <td><input type="number" name="grade_{{ r.id }}" min="0" max="100" class="grade-input"></td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
                <button type="submit" class="save-btn">save grades</button>
            </form>
            {% endif %}
        </div>
    </div>
</div>
<script>
    const allGrades = {{ all_grades | tojson }};

    const itemSelect = document.getElementById('item');
    if (itemSelect) {
        itemSelect.addEventListener('change', function() {
            const grades = allGrades[this.value] || {};
            document.querySelectorAll('.grade-input').forEach(input => {
                const sid = input.name.replace('grade_', '');
                input.value = (grades[sid] !== undefined) ? grades[sid] : '';
            });
        });
    }
</script>
{% endblock %}
