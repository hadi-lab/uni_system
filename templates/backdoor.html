{% extends "base.html" %}
{% block content %}
<div class="backdoor">

    {% if added %}
        <p class="success-banner">{{ added }} added successfully ✓</p>
    {% endif %}
    {% if error %}
        <p class="error-banner">{{ error }}</p>
    {% endif %}

    <div class="tab-bar">
        <button onclick="showForm('courseform', this)" class="active">add course</button>
        <button onclick="showForm('assignmentform', this)">add assignment</button>
        <button onclick="showForm('examform', this)">add exam</button>
        <button onclick="showForm('programform', this)">add program</button>
        <button onclick="showForm('prereqform', this)">add prerequisites</button>
    </div>

    <div id="courseform" class="form-card">
        <form action="/addcourse" method="post">
            <label for="c_code">Course code</label>
            <input type="text" name="coursecode" id="c_code" required>

            <label for="c_name">Course name</label>
            <input type="text" name="coursename" id="c_name" required>

            <label for="c_cap">Capacity</label>
            <input type="number" name="capacity" id="c_cap" min="0">

            <label for="c_prog">Program</label>
            <select name="program_id" id="c_prog" required>
                <option value="">-- choose a program --</option>
                {% for p in programs %}
                    <option value="{{ p.id }}">{{ p.name }}</option>
                {% endfor %}
            </select>

            <button type="submit">add course</button>
        </form>
    </div>

    <div id="assignmentform" class="form-card" style="display:none;">
        <form action="/addassignment" method="post">
            <label for="a_course">Course</label>
            <select name="coursecode" id="a_course" required>
                <option value="">-- which course --</option>
                {% for c in courses %}
                    <option value="{{ c.code }}">{{ c.name }}</option>
                {% endfor %}
            </select>

            <label for="a_name">Name</label>
            <input type="text" name="name" id="a_name" required>

            <label for="a_id">Assignment id</label>
            <input type="text" name="assignmentid" id="a_id" required>

            <label for="a_date">Date</label>
            <input type="date" name="date" id="a_date" required>

            <button type="submit">add assignment</button>
        </form>
    </div>

    <div id="examform" class="form-card" style="display:none;">
        <form action="/addexam" method="post">
            <label for="e_course">Course</label>
            <select name="coursecode" id="e_course" required>
                <option value="">-- which course --</option>
                {% for c in courses %}
                    <option value="{{ c.code }}">{{ c.name }}</option>
                {% endfor %}
            </select>

            <label for="e_name">Name</label>
            <input type="text" name="name" id="e_name" required>

            <label for="e_id">Exam id</label>
            <input type="text" name="examid" id="e_id" required>

            <label for="e_date">Date</label>
            <input type="date" name="date" id="e_date" required>

            <button type="submit">add exam</button>
        </form>
    </div>

    <div id="programform" class="form-card" style="display:none;">
        <form action="/addprogram" method="post">
            <label for="p_id">Program id</label>
            <input type="text" name="programid" id="p_id" required>

            <label for="p_name">Program name</label>
            <input type="text" name="name" id="p_name" required>

            <button type="submit">add program</button>
        </form>
    </div>

    <div id="prereqform" class="form-card" style="display:none;">
        <form action="/addprereq" method="post">
            <label for="pr_course">Course</label>
            <select name="course_code" id="pr_course" required>
                <option value="">-- course --</option>
                {% for c in courses %}
                    <option value="{{ c.code }}">{{ c.name }}</option>
                {% endfor %}
            </select>

            <label for="pr_req">Requires</label>
            <select name="required_course" id="pr_req" required>
                <option value="">-- required course --</option>
                {% for c in courses %}
                    <option value="{{ c.code }}">{{ c.name }}</option>
                {% endfor %}
            </select>

            <button type="submit">add prerequisite</button>
        </form>
    </div>

</div>

<script>
    function showForm(id, btn) {
        // hide all form cards
        document.querySelectorAll('.form-card').forEach(f => f.style.display = 'none');
        // show the chosen one
        document.getElementById(id).style.display = 'block';
        // update active tab
        document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>
{% endblock %}
